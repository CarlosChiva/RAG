<!-- menu.component.html -->
<h1 id="Tittle">Welcome {{username}}</h1>

<div class="container">
  <div class="icon-container" id="iconContainer">
    <!-- Servicios del usuario -->
    <div class="card" *ngIf="services['chatbot']" (click)="navigateTo('chatbot')">
      <div class="icon">
        <img [src]="icons['chatbot']" alt="chatbot">
      </div>
      <h3>Chatbot</h3>
      <p>Chat general con IA</p>
    </div>
    <div class="card" *ngIf="services['pdf']" (click)="navigateTo('pdf')">
      <div class="icon">
        <img [src]="icons['pdf']" alt="pdf">
      </div>
      <h3>PDF</h3>
      <p>Analiza documentos PDF</p>
    </div>
    <div class="card" *ngIf="services['multimedia']" (click)="navigateTo('multimedia')">
      <div class="icon">
        <img [src]="icons['multimedia']" alt="multimedia">
      </div>
      <h3>Multimedia</h3>
      <p>Gestiona videos y multimedia</p>
    </div>
    <div class="card" *ngIf="services['excel']" (click)="navigateTo('excel')">
      <div class="icon">
        <img [src]="icons['excel']" alt="excel">
      </div>
      <h3>Excel</h3>
      <p>Analiza archivos Excel</p>
    </div>
    <div class="card" *ngIf="services['ddbb']" (click)="navigateTo('ddbb')">
      <div class="icon">
        <img [src]="icons['ddbb']" alt="ddbb">
      </div>
      <h3>Base de Datos</h3>
      <p>Consulta bases de datos</p>
    </div>
  </div>
</div>

<button id="openSidebar" class="add-button" (click)="openSidebar()">+</button>

<!-- Sidebar -->
<div id="sidebar" class="sidebar" [class.active]="sidebarActive">
  <button id="closeSidebar" class="close-button" (click)="closeSidebar()">&times;</button>
  <h2>Servicios Disponibles</h2>
  <div id="sidebarIcons" class="sidebar-icons">
    <a *ngFor="let service of availableServices" 
       href="javascript:void(0)" 
       class="icon-sidebar-button" 
       (click)="selectService(service)">
      <img [src]="getIcon(service)" [alt]="service">
    </a>
  </div>
</div>
